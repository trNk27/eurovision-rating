<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11071f">
<title>Eurovision 2026 — My Ranking</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#11071f; --bg2:#1d0f33; --card:#241541; --card2:#2e1c52;
    --line:#3d2a63; --text:#f3edff; --dim:#a99bce; --accent:#ff3da6;
    --accent2:#7b5cff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#1d0f33,#11071f 60%) fixed;
    color:var(--text); min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(17,7,31,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  }
  .titlerow{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  h1{font-size:18px; margin:0; letter-spacing:.3px;}
  h1 span{color:var(--accent);}
  nav{display:flex; gap:6px; margin-top:9px;}
  .tab{
    flex:1; padding:8px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); border-radius:9px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .tab.on{background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff; border-color:transparent;}
  .hint{margin:8px 0 0; font-size:12.5px; color:var(--dim); line-height:1.4;}
  .editbtn{
    flex:none; padding:9px 14px; border:1px solid var(--line); background:var(--card);
    color:var(--dim); border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .editbtn.on{background:#fff; color:#11071f; border-color:#fff;}
  main{padding:14px; max-width:560px; margin:0 auto;}

  .card{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px; margin-bottom:10px;
  }
  .rank{
    flex:none; width:38px; height:38px; border-radius:10px; background:var(--bg2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800; color:var(--dim);
  }
  .rank.gold{background:#ffd54a; color:#3a2c00; border-color:#ffd54a;}
  .rank.silver{background:#d8d8e8; color:#2a2a38; border-color:#d8d8e8;}
  .rank.bronze{background:#e0a878; color:#3a2208; border-color:#e0a878;}
  .flag{font-size:27px; flex:none;}
  .meta{flex:1; min-width:0;}
  .country{font-weight:700; font-size:16px;}
  .ord{
    font-size:11px; font-weight:600; color:var(--dim); background:var(--bg2);
    border:1px solid var(--line); border-radius:6px; padding:1px 5px; margin-left:4px;
    white-space:nowrap;
  }
  .pts{font-size:12px; font-weight:800; color:#ffd54a; margin-left:6px; white-space:nowrap;}
  .sub{font-size:13px; color:var(--dim); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .handle{
    flex:none; width:46px; align-self:stretch; min-height:42px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; color:var(--dim); cursor:grab; touch-action:none;
    border-radius:10px; background:var(--card2);
  }
  .handle:active{cursor:grabbing;}

  /* drag visuals (SortableJS) */
  .sortable-ghost{opacity:.25;}
  .sortable-drag{opacity:1; box-shadow:0 10px 26px rgba(0,0,0,.55);}
  .sortable-chosen .handle{color:var(--accent);}

  /* edit mode */
  .card.editing .efields{display:grid; gap:6px; flex:1; min-width:0;}
  .efields input{
    width:100%; padding:8px 9px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg2); color:var(--text); font-size:14px;
  }
  .del{
    flex:none; width:34px; height:34px; border-radius:9px;
    background:var(--card2); border:1px solid #5c2b3f; color:#ff8a8a;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .addcard{
    background:var(--card); border:1px dashed var(--line); border-radius:14px;
    padding:12px; margin-bottom:10px;
  }
  .addcard .ttl{font-weight:700; margin-bottom:9px;}
  .addcard input{
    width:100%; padding:9px 10px; margin-bottom:6px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg2); color:var(--text); font-size:14px;
  }
  .addcard button{
    width:100%; margin-top:3px; padding:11px; border-radius:10px; border:none;
    background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  .reset{
    display:block; margin:16px auto 8px; padding:10px 16px; border-radius:10px;
    background:transparent; border:1px solid var(--line); color:var(--dim);
    font-size:13px; cursor:pointer;
  }

  /* compare / results */
  .summary{
    text-align:center; padding:16px 14px; margin-bottom:12px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  .bigpct{font-size:48px; font-weight:800; line-height:1; color:var(--accent);}
  .bigpct small{font-size:22px;}
  .sumlabel{
    font-size:11px; color:var(--dim); margin-top:3px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .sumline{font-size:13.5px; margin-top:11px; line-height:1.5;}
  .legend{font-size:11.5px; color:var(--dim); margin-top:7px; line-height:1.5;}
  .delta{
    flex:none; min-width:46px; height:36px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px;
  }
  .delta.exact{background:hsl(142,58%,42%); color:#fff;}
  .delta.good{background:hsl(110,42%,38%); color:#fff;}
  .delta.mid{background:hsl(40,78%,50%); color:#3a2a00;}
  .delta.bad{background:hsl(2,64%,50%); color:#fff;}
  .delta.bnone{background:var(--card2); color:var(--dim); font-size:18px;}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>Eurovision <span>2026</span></h1>
    <button class="editbtn" id="editbtn">Edit</button>
  </div>
  <nav>
    <button class="tab" data-view="rank">My Ranking</button>
    <button class="tab" data-view="compare">Results</button>
  </nav>
  <p class="hint" id="hint"></p>
</header>
<main>
  <div id="list"></div>
  <div id="extra"></div>
</main>

<script src="Sortable.min.js"></script>
<script>
"use strict";
const STORE_KEY = "esc2026";

// Seed list — Eurovision 2026 Grand Final, running order (Vienna, 16 May 2026)
const DEFAULT_ACTS = [
  ["🇩🇰","Denmark","Søren Torpegaard Lund","Før Vi Går Hjem"],
  ["🇩🇪","Germany","Sarah Engels","Fire"],
  ["🇮🇱","Israel","Noam Bettan","Michelle"],
  ["🇧🇪","Belgium","Essyla","Dancing on the Ice"],
  ["🇦🇱","Albania","Alis","Nân"],
  ["🇬🇷","Greece","Akylas","Ferto"],
  ["🇺🇦","Ukraine","Leléka","Ridnym"],
  ["🇦🇺","Australia","Delta Goodrem","Eclipse"],
  ["🇷🇸","Serbia","Lavina","Kraj Mene"],
  ["🇲🇹","Malta","Aidan","Bella"],
  ["🇨🇿","Czechia","Daniel Žižka","Crossroads"],
  ["🇧🇬","Bulgaria","Dara","Bangaranga"],
  ["🇭🇷","Croatia","Lelek","Andromeda"],
  ["🇬🇧","United Kingdom","Look Mum No Computer","Eins, Zwei, Drei"],
  ["🇫🇷","France","Monroe","Regarde !"],
  ["🇲🇩","Moldova","Satoshi","Viva, Moldova!"],
  ["🇫🇮","Finland","Linda Lampenius & Pete Parkkonen","Liekinheitin"],
  ["🇵🇱","Poland","Alicja","Pray"],
  ["🇱🇹","Lithuania","Lion Ceccah","Sólo Quiero Más"],
  ["🇸🇪","Sweden","Felicia","My System"],
  ["🇨🇾","Cyprus","Antigoni","Jalla"],
  ["🇮🇹","Italy","Sal Da Vinci","Per Sempre Sì"],
  ["🇳🇴","Norway","Jonas Lovv","Ya Ya Ya"],
  ["🇷🇴","Romania","Alexandra Căpitănescu","Choke Me"],
  ["🇦🇹","Austria","Cosmó","Tanzschein"]
];

// Official 2026 Grand Final result, highest first: [running-order #, points]
const RESULTS = [
  [12,516],[3,343],[24,296],[8,287],[22,281],[17,279],[1,243],[16,226],
  [7,221],[6,220],[15,158],[18,150],[5,145],[23,134],[13,124],[11,113],
  [9,90],[10,89],[21,75],[20,51],[4,36],[19,22],[2,12],[25,6],[14,1]
];

const uid = () => "a" + Math.random().toString(36).slice(2, 9);
// `ord` = fixed running-order number (stays put when you re-rank)
const freshActs = () => DEFAULT_ACTS.map((a, i) => ({
  id: uid(), ord: i+1, flag: a[0], country: a[1], artist: a[2], song: a[3]
}));

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.acts) && s.acts.length){
        let acts = s.acts;
        // migrate from the old 1-10 score version: order by score, high first
        if (s.scores && Object.keys(s.scores).length){
          acts = acts.slice().sort((a,b) => (s.scores[b.id]||0) - (s.scores[a.id]||0));
        }
        acts.forEach((a,i) => { if (a.ord == null) a.ord = i+1; });
        return { version:2, acts };
      }
    }
  } catch(e){ /* corrupt storage — fall through to fresh */ }
  return { version:2, acts: freshActs() };
}
function save(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch(e){
    alert("Could not save — storage may be full or blocked.");
  }
}

let state = load();
let view = "rank";          // "rank" | "compare"
let editMode = false;
let sortable = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const listEl  = document.getElementById("list");
const extraEl = document.getElementById("extra");
const editBtn = document.getElementById("editbtn");
const hintEl  = document.getElementById("hint");

const medalClass = r => r===1 ? "gold" : r===2 ? "silver" : r===3 ? "bronze" : "";

/* ---------- My Ranking view ---------- */
function rankCardHTML(act, i){
  const r = i + 1;
  const medal = medalClass(r);
  if (editMode){
    return `<div class="card editing" data-id="${act.id}">
      <div class="rank ${medal}">${r}</div>
      <div class="efields">
        <input data-field="flag"    data-id="${act.id}" value="${esc(act.flag)}"    placeholder="Flag">
        <input data-field="country" data-id="${act.id}" value="${esc(act.country)}" placeholder="Country">
        <input data-field="artist"  data-id="${act.id}" value="${esc(act.artist)}"  placeholder="Artist">
        <input data-field="song"    data-id="${act.id}" value="${esc(act.song)}"    placeholder="Song">
      </div>
      <button class="del" data-action="del" data-id="${act.id}">✕</button>
      <div class="handle">⠿</div>
    </div>`;
  }
  return `<div class="card" data-id="${act.id}">
    <div class="rank ${medal}">${r}</div>
    <span class="flag">${esc(act.flag) || "🏳️"}</span>
    <div class="meta">
      <div class="country">${esc(act.country)}<span class="ord" title="Running order">▶ ${act.ord}</span></div>
      <div class="sub">${esc(act.artist)} — <i>${esc(act.song)}</i></div>
    </div>
    <div class="handle">⠿</div>
  </div>`;
}

/* ---------- Results / compare view ---------- */
function compareData(){
  const rows = RESULTS.map((r, idx) => {
    const ord = r[0], points = r[1], officialRank = idx + 1;
    const i = state.acts.findIndex(a => a.ord === ord);
    const seed = DEFAULT_ACTS[ord-1] || ["🏳️","?","",""];
    return {
      officialRank, points,
      userRank: i < 0 ? null : i + 1,
      flag: seed[0], country: seed[1]
    };
  });
  const matched = rows.filter(r => r.userRank != null);
  const n = matched.length;
  const exact = matched.filter(r => r.userRank === r.officialRank).length;
  const sumAbs = matched.reduce((s,r) => s + Math.abs(r.userRank - r.officialRank), 0);
  const maxAbs = Math.floor(n*n / 2) || 1;          // worst case = fully reversed
  const accuracy = Math.max(0, Math.round((1 - sumAbs / maxAbs) * 100));
  return { rows, n, exact, accuracy, winner: rows[0] };
}

function compareHTML(){
  const d = compareData();
  const winnerLine = d.winner.userRank === 1
    ? "🎉 You called the winner!"
    : `Winner ${esc(d.winner.country)} — you had it #${d.winner.userRank == null ? "–" : d.winner.userRank}`;

  let html = `<div class="summary">
    <div class="bigpct">${d.accuracy}<small>%</small></div>
    <div class="sumlabel">ranking accuracy</div>
    <div class="sumline">${d.exact} of ${d.n} placed exactly · ${winnerLine}</div>
    <div class="legend">✓ exact spot &nbsp;·&nbsp; ↑ you rated it higher than it finished &nbsp;·&nbsp; ↓ lower</div>
  </div>`;

  html += d.rows.map(r => {
    let badge, bclass;
    if (r.userRank == null){
      badge = "—"; bclass = "bnone";
    } else {
      const diff = r.userRank - r.officialRank;   // <0 = you rated it higher
      const m = Math.abs(diff);
      bclass = m===0 ? "exact" : m<=2 ? "good" : m<=6 ? "mid" : "bad";
      badge = m===0 ? "✓" : (diff<0 ? "↑" : "↓") + m;
    }
    return `<div class="card">
      <div class="rank ${medalClass(r.officialRank)}">${r.officialRank}</div>
      <span class="flag">${esc(r.flag)}</span>
      <div class="meta">
        <div class="country">${esc(r.country)}<span class="pts">${r.points} pts</span></div>
        <div class="sub">${r.userRank == null ? "not in your list" : "your ranking: #" + r.userRank}</div>
      </div>
      <div class="delta ${bclass}">${badge}</div>
    </div>`;
  }).join("");
  return html;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.view === view));
  editBtn.style.display = view === "rank" ? "" : "none";
  editBtn.classList.toggle("on", editMode);

  if (view === "compare"){
    hintEl.textContent = "Your ranking vs the official Eurovision 2026 result.";
    if (sortable){ sortable.destroy(); sortable = null; }
    listEl.innerHTML = compareHTML();
    extraEl.innerHTML = "";
    return;
  }

  hintEl.innerHTML = editMode
    ? "<b>Editing</b> — rename, remove or add acts. Drag still works."
    : "Drag the ⠿ handle to rank the acts — <b>#1 is your winner</b>.";
  listEl.innerHTML = state.acts.map(rankCardHTML).join("");
  extraEl.innerHTML = editMode
    ? `<div class="addcard">
         <div class="ttl">+ Add an act</div>
         <input id="add-flag"    placeholder="Flag (e.g. 🇪🇺)">
         <input id="add-country" placeholder="Country">
         <input id="add-artist"  placeholder="Artist">
         <input id="add-song"    placeholder="Song">
         <button data-action="add">Add act</button>
       </div>
       <button class="reset" data-action="reset">Reset to running order</button>`
    : "";
  initSortable();
}

function initSortable(){
  if (sortable) sortable.destroy();
  sortable = Sortable.create(listEl, {
    handle: ".handle",
    draggable: ".card",
    animation: 150,
    forceFallback: true,        // consistent drag on touch + mouse
    fallbackTolerance: 4,
    onEnd: syncOrder
  });
}

// after a drag: rebuild state.acts to match the new DOM order, save, renumber
function syncOrder(){
  const order = [...listEl.querySelectorAll(".card")].map(c => c.dataset.id);
  state.acts.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
  save();
  listEl.querySelectorAll(".card").forEach((c,i) => {
    const rk = c.querySelector(".rank");
    rk.textContent = i + 1;
    rk.className = "rank " + medalClass(i + 1);
  });
}

const actById = id => state.acts.find(a => a.id === id);

// clicks: delete / add / reset (delegated)
document.querySelector("main").addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "del"){
    const act = actById(el.dataset.id);
    if (act && confirm(`Remove ${act.country}?`)){
      state.acts = state.acts.filter(a => a.id !== act.id);
      save(); render();
    }
  } else if (action === "add"){
    const get = i => (document.getElementById(i).value || "").trim();
    const country = get("add-country");
    if (!country){ alert("Enter at least a country name."); return; }
    const maxOrd = state.acts.reduce((m,a) => Math.max(m, a.ord||0), 0);
    state.acts.push({
      id: uid(), ord: maxOrd + 1, flag: get("add-flag") || "🏳️",
      country, artist: get("add-artist"), song: get("add-song")
    });
    save(); render();
  } else if (action === "reset"){
    if (confirm("Reset the list back to the original running order?")){
      state = { version:2, acts: freshActs() };
      editMode = false;
      save(); render();
    }
  }
});

// inline text edits — update state without re-rendering (keeps input focus)
document.querySelector("main").addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.field && el.dataset.id){
    const act = actById(el.dataset.id);
    if (act){ act[el.dataset.field] = el.value; save(); }
  }
});

document.querySelector("nav").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab){ view = tab.dataset.view; render(); }
});
editBtn.addEventListener("click", () => { editMode = !editMode; render(); });

render();
</script>
</body>
</html>
